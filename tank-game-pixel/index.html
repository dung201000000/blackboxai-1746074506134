<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Pixel Tank Game - 30/4 Vietnam Commemoration</title>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body {
      font-family: 'Press Start 2P', cursive;
      background: linear-gradient(to bottom, #87ceeb, #f0f8ff);
      margin: 0;
      overflow: hidden;
    }
    #gameCanvas {
      background: #222;
      display: block;
      margin: 20px auto;
      image-rendering: pixelated;
      border: 4px solid #444;
      border-radius: 8px;
    }
    .scoreboard {
      color: #fff;
      text-align: center;
      font-size: 1.2rem;
      margin-top: 10px;
      user-select: none;
    }
    .end-screen {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.85);
      color: #fff;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      font-size: 1.5rem;
      z-index: 10;
      font-weight: bold;
      user-select: none;
    }
    .btn-restart {
      margin-top: 20px;
      background: #4ade80;
      color: #000;
      padding: 10px 20px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
      transition: background-color 0.3s ease;
    }
    .btn-restart:hover {
      background: #22c55e;
    }
  </style>
</head>
<body>
  <canvas id="gameCanvas" width="480" height="640"></canvas>
  <div class="scoreboard" id="scoreboard">Score: 0</div>
  <div class="end-screen hidden" id="endScreen">
    <div>Chúc mừng bạn đã đạt điểm 999!</div>
    <div>Kỷ niệm 30/4 Việt Nam</div>
    <button class="btn-restart" id="restartBtn">Chơi lại</button>
  </div>
  <script src="main.js"></script>
</body>
</html>
